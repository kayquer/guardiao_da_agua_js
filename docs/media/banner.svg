<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">Guardião da Água</title>
  <desc id="d">Jogo educativo de simulação de cidade sobre recursos hídricos, com ondas de água animadas.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3d6b"/>
      <stop offset="1" stop-color="#1f8fc9"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#29c6e8"/>
      <stop offset="1" stop-color="#0a78b0"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f9fd1"/>
      <stop offset="1" stop-color="#065a8a"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bff3ff"/>
      <stop offset="1" stop-color="#22b8e6"/>
    </linearGradient>
    <style>
      .wave { animation: slide 9s linear infinite; }
      .wave.b { animation-duration: 14s; animation-direction: reverse; }
      .bob { animation: bob 3.2s ease-in-out infinite; transform-origin: 1090px 150px; }
      .spark { animation: blink 2.4s ease-in-out infinite; }
      .spark.s2 { animation-delay: .8s; }
      .spark.s3 { animation-delay: 1.6s; }
      @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-640px); } }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes blink { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .wave, .bob, .spark { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="320" fill="url(#sky)"/>

  <!-- cidade em silhueta -->
  <g fill="#0a2f52" opacity=".55">
    <rect x="70" y="170" width="46" height="70"/><rect x="124" y="140" width="38" height="100"/>
    <rect x="170" y="185" width="60" height="55"/><rect x="238" y="155" width="34" height="85"/>
    <path d="M300 240v-60l30-24 30 24v60z"/><rect x="372" y="175" width="52" height="65"/>
    <rect x="760" y="180" width="44" height="60"/><rect x="812" y="150" width="30" height="90"/>
    <rect x="850" y="190" width="64" height="50"/>
    <!-- turbina eólica -->
    <rect x="948" y="120" width="5" height="120"/>
  </g>
  <g transform="translate(950 120)" fill="#0a2f52" opacity=".55">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      <path d="M0 0 L-4 -46 L4 -46 Z"/><path d="M0 0 L-4 -46 L4 -46 Z" transform="rotate(120)"/><path d="M0 0 L-4 -46 L4 -46 Z" transform="rotate(240)"/>
    </g>
  </g>

  <!-- ondas -->
  <g class="wave b">
    <path fill="url(#w2)" opacity=".85" d="M0 236 C80 220 160 252 240 236 S400 220 480 236 S640 252 720 236 S880 220 960 236 S1120 252 1200 236 S1360 220 1440 236 S1600 252 1680 236 S1840 220 1920 236 V320 H0 Z"/>
  </g>
  <g class="wave">
    <path fill="url(#w1)" d="M0 262 C106 244 213 280 320 262 S533 244 640 262 S853 280 960 262 S1173 244 1280 262 S1493 280 1600 262 S1813 244 1920 262 V320 H0 Z"/>
  </g>

  <!-- gota -->
  <g class="bob">
    <path d="M1090 70 C1090 70 1040 135 1040 168 a50 50 0 0 0 100 0 C1140 135 1090 70 1090 70 Z" fill="url(#drop)" stroke="#06375c" stroke-width="5"/>
    <ellipse cx="1072" cy="160" rx="9" ry="16" fill="#fff" opacity=".7"/>
    <circle cx="1075" cy="178" r="5" fill="#06375c"/><circle cx="1105" cy="178" r="5" fill="#06375c"/>
    <path d="M1078 196 q12 10 24 0" fill="none" stroke="#06375c" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g fill="#fff">
    <circle class="spark" cx="1010" cy="96" r="4"/>
    <circle class="spark s2" cx="1168" cy="118" r="3"/>
    <circle class="spark s3" cx="1150" cy="66" r="3.5"/>
  </g>

  <!-- título -->
  <text x="70" y="92" font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif" font-size="66" font-weight="900" fill="#fff" stroke="#06375c" stroke-width="10" paint-order="stroke" letter-spacing="1">Guardião da Água</text>
  <text x="74" y="134" font-family="'Segoe UI', Verdana, sans-serif" font-size="24" font-weight="700" fill="#e6fbff">Jogo educativo de cidade sobre água, rios e escolhas · Unesp</text>
</svg>
