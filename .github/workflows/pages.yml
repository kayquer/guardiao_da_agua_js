# GitHub Pages: publica a main (versão da pesquisa). A versão paralela (branch evolucao-pesquisa) saiu deste
# repositório em 11/2026 e não é mais publicada aqui. Pages precisa estar em "Source: GitHub Actions" (Settings → Pages).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Montar o site
        run: |
          copy() { rsync -a --exclude '.git' --exclude '.github' --exclude '.githooks' --exclude 'tests' \
            --exclude 'node_modules' --exclude '__pycache__' "$1/" "$2/"; }
          mkdir -p site
          copy main site
          du -sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
