# GitHub Pages com duas versões do jogo no mesmo site:
#   /                       → main (versão da pesquisa atual)
#   /evolucao-pesquisa/     → branch evolucao-pesquisa (versão paralela para a próxima pesquisa)
# Um push em qualquer uma das duas publica as duas de novo. As versões dividem o localStorage
# (é por domínio): cada uma usa o seu STORAGE_PREFIX (js/config/GameConstants.js).
# Pages precisa estar em "Source: GitHub Actions" (Settings → Pages).
name: pages

on:
  push:
    branches: [main, evolucao-pesquisa]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0 # histórico inteiro: o número do build é a contagem de commits
      - name: Branch evolucao-pesquisa existe?
        id: evo
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" evolucao-pesquisa >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.evo.outputs.exists == 'true'
        with:
          ref: evolucao-pesquisa
          path: evo
          fetch-depth: 0
      - name: Montar o site
        run: |
          # build-info.json = versão no rodapé do aviso inicial (release do package.json, branch, build, commit)
          info() {
            jq -n --arg release "$(jq -r '.version // ""' "$1/package.json")" --arg branch "$2" \
              --argjson build "$(git -C "$1" rev-list --count HEAD)" \
              --arg commit "$(git -C "$1" rev-parse --short HEAD)" --arg date "$(git -C "$1" log -1 --format=%cI)" \
              '{release: $release, branch: $branch, build: $build, commit: $commit, date: $date}' > "$1/build-info.json"
          }
          info main main
          if [ -d evo ]; then info evo evolucao-pesquisa; fi
          copy() { rsync -a --exclude '.git' --exclude '.github' --exclude '.githooks' --exclude 'tests' \
            --exclude 'node_modules' --exclude '__pycache__' "$1/" "$2/"; }
          mkdir -p site
          copy main site
          if [ -d evo ]; then mkdir -p site/evolucao-pesquisa && copy evo site/evolucao-pesquisa; fi
          du -sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
